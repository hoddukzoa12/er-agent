# NeMo Agent Toolkit workflow: ER dispatch agent.
#   nat run   --config_file configs/dispatch.yml --input "..."
#   nat serve --config_file configs/dispatch.yml
#   nat eval  --config_file configs/dispatch_eval.yml
llms:
  nemotron:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 2048
    # Nemotron 3 reasoning trace off: ~7x faster on tool calls, same accuracy on our evals
    chat_template_kwargs:
      enable_thinking: false

functions:
  dispatch_plan:
    _type: er_dispatch_plan
  call_hospitals:
    _type: er_call_hospitals
    voice: false
  mark_rejected:
    _type: er_mark_rejected
  update_patient:
    _type: er_update_patient
  move_origin:
    _type: er_move_origin
  replan:
    _type: er_replan
  rejection_board:
    _type: er_rejection_board

workflow:
  _type: tool_calling_agent
  llm_name: nemotron
  tool_names: [dispatch_plan, call_hospitals, mark_rejected, update_patient, move_origin, replan, rejection_board]
  description: 119 구급대를 위한 응급실 수용 확보 에이전트
  max_iterations: 12
  handle_tool_errors: true
  max_empty_response_retries: 3
  system_prompt: |
    너는 119 구급대를 돕는 응급실 수용 확보 에이전트다. 진단하지 않는다.
    새 환자라면:
      1) dispatch_plan(patient, lat, lon, mode)으로 후보를 만든다. 위치가 없으면 서울 광화문(37.5714, 126.9768)을 쓴다.
      2) mode가 ems면 call_hospitals(dispatch_id)로 병원에 동시 문의한다. guardian이면 전화하지 않고 병원 목록과 119 권고를 안내한다.
      3) 확정 병원이 없으면 상황을 요약하고, 조건부 병원은 구급대원 직접 연결이 필요하다고 알린다.
    입력에 dispatch_id가 있고 현장 이벤트라면:
      - 이벤트에 여러 변화가 있으면 각각 도구를 호출한다: 병원 거절은 mark_rejected, 환자 상태 변화는 update_patient, 위치 변화는 move_origin. 모두 반영한 뒤 마지막에 replan을 한 번 호출한다.
      - "첫번째/1순위/그 병원"처럼 순번으로 말하면 '현재 후보' 목록의 번호로 병원을 고른다. 거절 사유 문구가 비슷하다는 이유로 다른 병원을 고르지 않는다.
      - 사용자가 다시 문의를 요청하면 call_hospitals를 호출한다.
    최종 답변은 한국어 3문장 이내: 확정 병원(이름·예상 도착·전화) 또는 다음 행동.
