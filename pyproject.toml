[project]
name = "er-agent"
version = "0.1.0"
description = "Emergency-department dispatch agent: live NEMC data, Nemotron, parallel AI inquiry calls, NeMo Guardrails, OpenShell"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "nemoguardrails>=0.24.1",
    "nvidia-nat[langchain]>=1.6.0",
    "nvidia-riva-client>=2.27.0",
    "openai>=3.19.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
er-agent = "er_agent:main"

[project.entry-points."nat.components"]
er_agent = "er_agent.nat_tools"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
